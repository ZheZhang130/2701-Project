[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safedrive"
version = "0.1.0"
description = "Driver-separated data foundation for SafeDrive monitoring"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
train = ["torch==2.14.0", "torchvision==0.29.0", "numpy==2.5.3"]

[tool.setuptools.packages.find]
where = ["src"]
